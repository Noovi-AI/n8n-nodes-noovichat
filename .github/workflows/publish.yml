name: Publish to npm

# Auth: org/repo secret NPM_TOKEN, or npm Trusted Publisher for this
# workflow filename (publish.yml) on @nooviai/n8n-nodes-noovichat.

on:
  push:
    branches: [master, main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Publish if unpublished (or auto-bump contract drift)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          AUTO_BUMP: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && '1' || '0' }}
        run: bash .github/scripts/publish-if-needed.sh
